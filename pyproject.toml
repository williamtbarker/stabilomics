[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stabilomics"
version = "0.1.0"
description = "Deterministic robust stability selection for high-dimensional scientific tables"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Will Barker" }]
keywords = [
  "bioinformatics",
  "feature-selection",
  "genomics",
  "lad-lasso",
  "reproducibility",
  "stability-selection",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24,<2.3",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1",
  "twine>=5,<8",
]

[project.scripts]
stabilomics = "stabilomics.cli:main"

[project.urls]
Documentation = "https://github.com/williamtbarker/stabilomics#readme"
Issues = "https://github.com/williamtbarker/stabilomics/issues"
Repository = "https://github.com/williamtbarker/stabilomics"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["stabilomics"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=stabilomics --cov-branch --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
